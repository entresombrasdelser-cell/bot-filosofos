name: Generar clips (caballero, mago y gatos)

# Completa la biblioteca assets/clips/ con los Spaces gratuitos de Hugging Face (ver tools/make_clips.py):
# tomas de ~15 s en tres trozos (inicio + continuaciones b y c).
# La cuota gratuita de GPU da para ~1-2 trozos por ejecución, así que se lanza cada hora; cuando la biblioteca
# está completa, el workflow se desactiva solo (para añadir escenas nuevas, vuelve a activarlo).
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      escenas:
        description: "Escenas o continuaciones a rehacer, p. ej. mago-fogata-1 o mago-fogata-1c (vacío = lo que falte)"
        type: string
        default: ""
      solo_fotogramas:
        description: "Solo generar los fotogramas, para revisar el diseño (no crea clips)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: clips
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt gradio_client

      - name: Recuperar fotogramas ya generados
        uses: actions/cache@v4
        with:
          path: output/stills
          key: stills-${{ github.run_id }}
          restore-keys: stills-

      - name: Generar lo que falte
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ESCENAS: ${{ inputs.escenas }}
          SOLO: ${{ inputs.solo_fotogramas }}
        run: |
          args="$ESCENAS"
          if [ "$SOLO" = "true" ]; then args="--stills $args"; fi
          # sale con error al agotarse la cuota: se guardan igualmente los clips ya generados
          timeout 35m python tools/make_clips.py $args || echo "::warning::Generación interrumpida (cuota o Space ocupado); se reintentará."

      - name: Subir fotogramas (para revisarlos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotogramas
          path: output/stills/
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar clips nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/clips
          if ! git diff --cached --quiet; then
            git commit -m "Clips nuevos: $(git diff --cached --name-only | xargs -n1 basename | tr '\n' ' ')"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Desactivar este workflow si la biblioteca está completa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(python tools/make_clips.py --missing)" = "0" ]; then
            echo "Biblioteca completa: desactivo el workflow."
            gh workflow disable clips.yml
          fi
